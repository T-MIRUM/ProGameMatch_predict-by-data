# Alembic 설정. DB 접속 정보는 여기 두지 않고 migrations/env.py가 DATABASE_URL 환경 변수에서 읽는다
# (비밀번호가 버전 관리에 들어가는 것을 막기 위해).
[alembic]
script_location = migrations
prepend_sys_path = src
# 파일명에 날짜를 넣어 여러 명이 동시에 마이그레이션을 만들 때 순서를 파악하기 쉽게 한다
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
