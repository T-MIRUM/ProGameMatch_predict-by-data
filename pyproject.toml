[project]
name = "propredict"
version = "0.1.0"
description = "VCT 라운드 시작 시점 상태로 라운드 승리 확률을 예측하는 포트폴리오 서비스"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # ETL / DB
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    # 모델
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "joblib>=1.4",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",  # FastAPI TestClient 의존성
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src 레이아웃: 테스트가 설치된 패키지를 import하게 강제해서 "로컬에선 되는데 Docker에선 안 되는" 경로 문제를 막는다
packages = ["src/propredict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: PostgreSQL이 필요한 통합 테스트 (DATABASE_URL 필요)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
