# 전체 스택: db(PostgreSQL 16) → api(FastAPI) → web(Next.js)
# .env가 없어도 뜨도록 모든 변수에 기본값(:-)을 둔다. 값을 바꾸려면 .env.example을 .env로 복사해 수정.
name: propredict

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propredict}
      POSTGRES_DB: ${POSTGRES_DB:-propredict}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"  # 호스트에서 ETL·학습 스크립트가 접속하기 위해 노출
    volumes:
      - pgdata:/var/lib/postgresql/data  # 컨테이너를 지워도 적재한 데이터는 유지
    healthcheck:
      # api가 DB '프로세스 시작'이 아니라 '접속 가능' 시점까지 기다리게 하려는 것
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      # 컨테이너 네트워크 안에서는 호스트명이 localhost가 아니라 서비스 이름(db)이다
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-propredict}:${POSTGRES_PASSWORD:-propredict}@db:5432/${POSTGRES_DB:-propredict}
      ARTIFACTS_DIR: /app/artifacts
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # 모델은 호스트에서 학습해 artifacts/에 두고 읽기 전용으로 마운트한다(이미지 재빌드 없이 교체 가능)
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # 브라우저가 호출하는 주소라서 컨테이너 이름(api)이 아니라 호스트 기준 주소를 쓴다
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
